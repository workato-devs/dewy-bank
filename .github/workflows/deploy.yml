name: deploy

# Deploy ONLY. Separated from ci.yml so the AWS OIDC deploy role is never
# present in the test phase (supply-chain least-privilege; Wiz CIS 2.1.1).
# Runs after a push to main (a merged PR) or a manual dispatch, and is gated by
# the `production` GitHub Environment (which carries the manual-approval
# reviewer). No AWS keys are stored — the job assumes an IAM role via OIDC.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      workshopId:
        description: Workshop prefix to deploy (e.g. demo01)
        required: false
        default: demo01

# Default to read-only; the deploy job elevates to id-token: write for OIDC.
permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  # Change these two in repo Settings → Variables if the role/workshop changes.
  DEPLOY_ROLE_ARN: arn:aws:iam::<your-account-id>:role/dewybank-github-deploy
  WORKSHOP_ID: ${{ github.event.inputs.workshopId || 'demo01' }}
  NPM_CONFIG_IGNORE_SCRIPTS: "true"

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # required for OIDC
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json

      # Install with lifecycle scripts disabled (Wiz: npm supply-chain hardening),
      # then rebuild only the trusted native-binary deps the CDK esbuild bundle needs.
      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Rebuild trusted native deps
        run: npm rebuild esbuild @swc/core

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-dewybank-deploy

      - name: CDK deploy (app stack)
        run: >-
          npx cdk deploy DewyBank-${{ env.WORKSHOP_ID }}
          -c workshopId=${{ env.WORKSHOP_ID }}
          --require-approval never
